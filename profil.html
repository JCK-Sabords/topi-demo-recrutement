<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Profil TOPI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192x192.png" sizes="192x192" type="image/png">
<script>(function(){var k="topi-demo-theme",q=new URLSearchParams(location.search).get("theme"),t=null;try{if(q==="light"||q==="dark")localStorage.setItem(k,q);t=localStorage.getItem(k);}catch(e){}if(q==="light"||q==="dark")t=q;if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<link rel="stylesheet" href="style.css?v=20261014c">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html">TOPI</a>
  <span class="prod">Recrutement</span>
  <div class="right">Profil candidat · démonstration</div>
  <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Thème sombre activé. Passer au thème clair" title="Thème sombre activé. Passer au thème clair"><span class="tt-knob"></span><span class="tt-ic tt-sun"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="tt-ic tt-moon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button>
</header>
<main id="app"></main>
<div id="tooltip" class="tooltip" role="tooltip"></div>
<script src="data.js?v=20261014c"></script>
<script src="defs.js?v=20261014c"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const c = CANDIDATS.find(x => x.id === id) || CANDIDATS[0];
document.title = "Profil TOPI - " + c.prenom + " " + c.nom;

const top3 = Object.entries(c.riasec).sort((a, b) => b[1] - a[1]).slice(0, 3);
const dateFr = new Date(c.date_passage).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });

const relKey = { "Excellent": "excellent", "Bon": "bon", "Convenable": "convenable", "Mauvais": "mauvais" }[c.validite.niveau] || "convenable";
const cvUrl = "cv.html?f=" + encodeURIComponent(c.cv) + "&n=" + encodeURIComponent(c.prenom + " " + c.nom);
const esc = s => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const tip = (kind, key, inner, cls = "") => `<span class="tip ${cls}" data-kind="${kind}" data-key="${esc(key)}">${inner}</span>`;

function radar() {
  const cx = 130, cy = 120, R = 84, order = ["R", "I", "A", "S", "E", "C"];
  const ang = i => (-90 + i * 60) * Math.PI / 180;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  const poly = f => order.map((k, i) => pt(i, R * f).join(",")).join(" ");
  const data = order.map((k, i) => pt(i, R * c.riasec[k] / 100).join(",")).join(" ");
  let s = `<svg viewBox="0 0 260 240" width="100%" style="max-width:300px">`;
  [0.25, 0.5, 0.75, 1].forEach(f => s += `<polygon points="${poly(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  order.forEach((k, i) => { const p = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)"/>`; });
  s += `<polygon points="${data}" fill="color-mix(in srgb, var(--accent) 22%, transparent)" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>`;
  order.forEach((k, i) => {
    const d = pt(i, R * c.riasec[k] / 100), l = pt(i, R + 16);
    s += `<circle cx="${d[0]}" cy="${d[1]}" r="3" fill="var(--accent)"/>`;
    s += `<g class="tip" data-kind="riasec" data-key="${k}" style="cursor:help"><circle cx="${l[0]}" cy="${l[1]}" r="12" fill="transparent"/><text x="${l[0]}" y="${l[1] + 4}" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)" style="font-family:var(--font-mono)">${k}</text></g>`;
  });
  return s + "</svg>";
}

const bar = (labelHtml, v, red) => `<div class="bar"><div><div class="lbl"><span>${labelHtml}</span></div><div class="track"><div class="fill ${red ? "red" : ""}" style="width:${v}%"></div></div></div><div class="val">${v}</div></div>`;

const axes = AXES.map((pair, i) => {
  const s = c.axes[i];
  return `<div class="axis"><div class="${s < 45 ? "on" : ""}">${tip("style", pair[0], pair[0], i.toString())}</div><div class="line"><div class="dot" style="left:${s}%"></div></div><div class="r ${s > 55 ? "on" : ""}">${tip("style", pair[1], pair[1], i.toString())}</div></div>`;
}).join("");

document.getElementById("app").innerHTML = `
  <a class="back" href="javascript:window.close()">Fermer l'onglet</a>
  <div class="card head">
    <div class="avatar">${c.prenom[0]}${c.nom[0]}</div>
    <div>
      <h1>${c.prenom} ${c.nom}</h1>
      <div class="meta">${c.parcours} · ${c.age} ans · Candidature ${c.ref}, ${c.poste}</div>
      <div class="meta">Test TOPI passé le ${dateFr}</div>
    </div>
    <div class="actions">
      <span class="rel rel-${relKey}" title="Indice d'incohérence : ${c.validite.incoherence}"><i></i>Fiabilité des réponses : ${c.validite.niveau}</span>
      <a class="btn" href="${cvUrl}" target="_blank" rel="noopener">Ouvrir le CV</a>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Intérêts professionnels, profil RIASEC</h2>
      <div class="triplet">${top3.map(e => tip("riasec", e[0], e[0])).join("")}</div>
      <div class="meta" style="margin-bottom:10px">${top3.map(e => RIASEC_LABELS[e[0]]).join(" · ")}</div>
      <div style="display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:center">
        <div>${radar()}</div>
        <div>${Object.keys(RIASEC_LABELS).map(k => bar(tip("riasec", k, RIASEC_LABELS[k]), c.riasec[k])).join("")}</div>
      </div>
    </div>
    <div class="card">
      <h2>Styles de travail, 11 axes</h2>
      ${axes}
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <h2>Ce qui le motive</h2>
    <div class="cols2">${CRITERES.map((k, i) => [k, c.attentes[i]]).sort((a, b) => b[1] - a[1]).map(e => bar(tip("critere", e[0], e[0]), e[1])).join("")}</div>
  </div>
  <p class="note">Résultats du test TOPI partagés avec le consentement explicite du candidat. Aide à la décision : ils préparent l'entretien, ils ne remplacent pas le jugement du recruteur. Données fictives.</p>
`;

const tt = document.getElementById("tooltip");
function content(el) {
  const kind = el.dataset.kind, key = el.dataset.key;
  if (kind === "riasec") return [RIASEC_LABELS[key], DEF_RIASEC[key]];
  if (kind === "critere") return [key, DEF_CRITERES[key]];
  const i = AXES.findIndex(p => p.includes(key));
  return [key + " (" + DIMENSIONS[i] + ")", DEF_STYLES[key]];
}
function place(e) {
  const pad = 14, w = tt.offsetWidth, h = tt.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tt.style.left = Math.max(8, x) + "px"; tt.style.top = Math.max(8, y) + "px";
}
document.addEventListener("mouseover", e => {
  const el = e.target.closest(".tip");
  if (!el) return;
  const [title, text] = content(el);
  tt.innerHTML = `<b>${title}</b><span>${text}</span>`;
  tt.style.display = "block"; place(e);
});
document.addEventListener("mousemove", e => { if (tt.style.display === "block") place(e); });
document.addEventListener("mouseout", e => { if (e.target.closest(".tip")) tt.style.display = "none"; });
</script>
<script src="theme.js?v=20261014c"></script>
</body>
</html>
